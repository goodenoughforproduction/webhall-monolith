services:
  db:
    image: postgres:latest
    container_name: webhall-postgres
    environment:
      POSTGRES_DB: webhall_db
      POSTGRES_USER: webhall_user
      POSTGRES_PASSWORD: webhall_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhall_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: webhall-app
    working_dir: /usr/src/app/src
    command: poetry run python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./src:/usr/src/app/src
    ports:
      - "80:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: "django-insecure-docker-dev-key"
      DATABASE_URL: "postgresql://webhall_user:webhall_password@db:5432/webhall_db"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
