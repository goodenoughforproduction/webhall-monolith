services:
  app:
    build:
      dockerfile: ./devops/containers/app/Dockerfile
    # tty: true
    # entrypoint: ''
    # command: nu
    volumes:
      - ./pyproject.toml:/usr/src/app/pyproject.toml:Z
      - ./poetry.lock:/usr/src/app/poetry.lock:Z
      - ./src:/usr/src/app/src
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18-alpine
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
